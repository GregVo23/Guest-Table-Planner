  <script>
    let draggedGuest = null;
    let offsetX = 0, offsetY = 0;
    let currentTableBeingNamed = null;

function createLabelForTable(table, defaultName) {
  const label = document.createElement("div");
  label.className = "table-label";
  label.textContent = defaultName;
  label.style.left = "50%";
  label.style.top = "50%";
  label.style.transform = "translate(-50%, -50%)";
  label.addEventListener("click", () => openTableNameModal(label));
  table.appendChild(label);
}

function openTableNameModal(labelElement) {
  currentTableBeingNamed = labelElement;
  const input = document.getElementById("tableNameInput");
  input.value = labelElement.textContent;
  document.getElementById("tableNameModal").style.display = "flex";
  setTimeout(() => input.focus(), 50); // Donne le focus après l'ouverture de la modale
}


function closeTableNameModal() {
  document.getElementById("tableNameModal").style.display = "none";
  currentTableBeingNamed = null;
}

function saveTableName() {
  const newName = document.getElementById("tableNameInput").value.trim();
  if (currentTableBeingNamed && newName) {
    currentTableBeingNamed.textContent = newName;
  }
  closeTableNameModal();
}

    document.getElementById('csvFileInput').addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        processCSV(e.target.result);
      };
      reader.readAsText(file);
    });

    function updateGuestCount() {
      let count = document.querySelectorAll("#guests .guest").length;
      document.getElementById("guestCount").textContent = count;
    }


    function processCSV(csvText) {
  const separator = csvText.includes(';') ? ';' : ',';
  const rows = csvText.trim().split('\n').map(row => row.split(separator));
  const guestsContainer = document.getElementById("guests");


  rows.slice(1).forEach(row => {
    if (row.length >= 2) {
      const givenName = String(row[0]).replaceAll('"', '');
      const familyName = String(row[1]).replaceAll('"', '');
      if (givenName && familyName) {
        let guestDiv = document.createElement("div");
        guestDiv.classList.add("guest");
        guestDiv.textContent = `${givenName} ${familyName}`;
        guestDiv.draggable = true;
        guestDiv.ondragstart = (e) => {
          draggedGuest = guestDiv;
          e.stopPropagation();
        };
        guestDiv.ondragend = () => {
          draggedGuest = null;
        };
        guestsContainer.appendChild(guestDiv);
      }
    }
  });

  updateGuestCount(); // Met à jour le compteur après le chargement
}


    function dropGuest(event, target) {
    event.preventDefault();
    if (!draggedGuest) return;

    if (target.classList.contains("seat")) {
        if (!target.hasChildNodes()) {
        target.appendChild(draggedGuest);
        updateGuestCount(); // Mettre à jour le compteur après déplacement
        }
    } else if (target.id === "guests") {
        target.appendChild(draggedGuest);
        updateGuestCount(); // Mettre à jour le compteur après retour dans la liste
    }
    }

    function generateRectTables() {
  let tableCountToAdd = parseInt(document.getElementById("rectTableCount").value);
  let existingRectTables = document.querySelectorAll(".table.rect").length;

  for (let i = 0; i < tableCountToAdd; i++) {
    createRectTable(100 + (existingRectTables + i) * 230, 400);
  }
}



    function generateTables() {
  let tableCountToAdd = parseInt(document.getElementById("tableCount").value);
  let seatCount = parseInt(document.getElementById("seatCount").value);
  let existingRoundTables = document.querySelectorAll(".table:not(.rect)").length;

  for (let i = 0; i < tableCountToAdd; i++) {
    createTable(100 + (existingRoundTables + i) * 210, 160, seatCount);
  }
}


    // Ajout dans les fonctions createTable et createRectTable
    let tableCounter = 1;

    function createTable(x, y, seatCount = 8) {

      
  let table = document.createElement("div");
  table.classList.add("table");
  table.dataset.seatCount = seatCount; // sauvegarde pour la conf
  table.style.left = `${x}px`;
  table.style.top = `${y}px`;

  let deleteButton = document.createElement("button");
deleteButton.textContent = "🗑️";
deleteButton.style.position = "absolute";
deleteButton.style.top = "0px";
deleteButton.style.right = "-10px";
deleteButton.style.background = "transparent";
deleteButton.style.border = "none";
deleteButton.style.color = "white";
deleteButton.style.borderRadius = "50%";
deleteButton.style.width = "24px";
deleteButton.style.height = "24px";
deleteButton.style.cursor = "pointer";
deleteButton.title = "Supprimer cette table";

deleteButton.onclick = () => openDeleteModal(table);
table.appendChild(deleteButton);


  table.onmousedown = function (e) {
    if (e.target.classList.contains("guest")) return;
    let draggedTable = table;
    offsetX = e.clientX - table.offsetLeft;
    offsetY = e.clientY - table.offsetTop;
    document.onmousemove = function (e) {
      if (!draggedTable) return;
      draggedTable.style.left = `${e.clientX - offsetX}px`;
      draggedTable.style.top = `${e.clientY - offsetY}px`;
    };
    document.onmouseup = function () {
      draggedTable = null;
      document.onmousemove = null;
    };
  };

  document.getElementById("room").appendChild(table);

  for (let i = 0; i < seatCount; i++) {
    let seat = document.createElement("div");
    seat.classList.add("seat");
    let angle = (i * 2 * Math.PI) / seatCount;
    seat.style.left = `${60 + 75 * Math.cos(angle)}px`;
    seat.style.top = `${60 + 75 * Math.sin(angle)}px`;
    seat.ondragover = (e) => e.preventDefault();
    seat.ondrop = (e) => dropGuest(e, seat);
    table.appendChild(seat);
  }

  createLabelForTable(table, `Table ${tableCounter++}`);

  return table;
}


    function createRectTable(x, y) {
      let table = document.createElement("div");
      table.classList.add("table", "rect");
      table.style.width = "310px";
      table.style.height = "150px";
      table.style.borderRadius = "10px";
      table.style.background = "#a1d99b";
      table.style.position = "absolute";
      table.style.left = `${x}px`;
      table.style.top = `${y}px`;

      let deleteButton = document.createElement("button");
deleteButton.textContent = "🗑️";
deleteButton.style.position = "absolute";
deleteButton.style.top = "-30px";
deleteButton.style.right = "-10px";
deleteButton.style.background = "transparent";
deleteButton.style.border = "none";
deleteButton.style.color = "white";
deleteButton.style.borderRadius = "50%";
deleteButton.style.width = "24px";
deleteButton.style.height = "24px";
deleteButton.style.cursor = "pointer";
deleteButton.title = "Supprimer cette table";

deleteButton.onclick = () => openDeleteModal(table);
table.appendChild(deleteButton);


      table.onmousedown = function (e) {
        if (e.target.classList.contains("guest")) return;
        let draggedTable = table;
        offsetX = e.clientX - table.offsetLeft;
        offsetY = e.clientY - table.offsetTop;
        document.onmousemove = function (e) {
          if (!draggedTable) return;
          draggedTable.style.left = `${e.clientX - offsetX}px`;
          draggedTable.style.top = `${e.clientY - offsetY}px`;
        };
        document.onmouseup = function () {
          draggedTable = null;
          document.onmousemove = null;
        };
      };

      const seatSpacing = [10, 60, 110, 160, 210, 260];
      const seatSideY = [30, 80];

      seatSpacing.forEach((left) => {
        let seatTop = createSeat(left, -15);
        let seatBottom = createSeat(left, 125);
        table.appendChild(seatTop);
        table.appendChild(seatBottom);
      });

      seatSideY.forEach((top) => {
        let seatLeft = createSeat(-15, top);
        let seatRight = createSeat(285, top);
        table.appendChild(seatLeft);
        table.appendChild(seatRight);
      });

      function createSeat(left, top) {
        let seat = document.createElement("div");
        seat.classList.add("seat");
        seat.style.left = `${left}px`;
        seat.style.top = `${top}px`;
        seat.ondragover = (e) => e.preventDefault();
        seat.ondrop = (e) => dropGuest(e, seat);
        return seat;
      }

      document.getElementById("room").appendChild(table);

      createLabelForTable(table, `Table ${tableCounter++}`);

      return table;
    }

    function deleteTable(table) {
  // Remet les invités assis à cette table dans la liste d'invités
  const guestsContainer = document.getElementById("guests");

  table.querySelectorAll(".seat").forEach(seat => {
    if (seat.firstChild && seat.firstChild.classList.contains("guest")) {
      guestsContainer.appendChild(seat.firstChild);
    }
  });

  // Supprimer la table de la salle
  table.remove();

  // Mettre à jour le compteur d'invités
  updateGuestCount();
}

</script>
  <script>
function saveConfiguration() {
  let tables = document.querySelectorAll(".table");
  let guests = document.querySelectorAll("#guests .guest");

  let data = {
    tables: [],
    guests: [],
  };

  tables.forEach((table) => {
    let tableData = {
      x: table.style.left,
      y: table.style.top,
      type: table.classList.contains("rect") ? "rect" : "round",
      label: table.querySelector(".table-label")?.textContent || "",
      seatCount: table.dataset.seatCount ? parseInt(table.dataset.seatCount) : 8,
      seats: []
    };

    table.querySelectorAll(".seat").forEach((seat, seatIndex) => {
      if (seat.firstChild) {
        tableData.seats.push({
          seatIndex: seatIndex,
          guest: seat.firstChild.textContent
        });
      }
    });

    data.tables.push(tableData);
  });

  guests.forEach(guest => data.guests.push(guest.textContent));

  let jsonData = JSON.stringify(data, null, 2);

  // Création et déclenchement du téléchargement
  let blob = new Blob([jsonData], { type: "application/json" });
  let url = URL.createObjectURL(blob);
  let a = document.createElement("a");
  a.href = url;
  a.download = "configuration.json";
  a.click();
  URL.revokeObjectURL(url);
}


  
    document.getElementById('loadConfig').addEventListener('change', function (event) {
      let file = event.target.files[0];
      if (!file) return;
      
      let reader = new FileReader();
      reader.onload = function (e) {
        let data = JSON.parse(e.target.result);
        loadConfiguration(data);
      };
      reader.readAsText(file);
    });
  
    function loadConfiguration(data) {
  document.getElementById("room").innerHTML = "";

  data.tables.forEach(tableData => {
    let table;
    if (tableData.type === "rect") {
      table = createRectTable(parseInt(tableData.x), parseInt(tableData.y));
    } else {
      table = createTable(parseInt(tableData.x), parseInt(tableData.y), tableData.seatCount || 8);
    }

    // Nom de la table
    let label = table.querySelector(".table-label");
    if (label && tableData.label) {
      label.textContent = tableData.label;
    }

    // Placer les invités
    tableData.seats.forEach(seatInfo => {
      let seat = table.querySelectorAll(".seat")[seatInfo.seatIndex];
      if (seat && !seat.firstChild) {
        let guestDiv = document.createElement("div");
        guestDiv.classList.add("guest");
        guestDiv.textContent = seatInfo.guest;
        guestDiv.draggable = true;
        guestDiv.ondragstart = (e) => { draggedGuest = guestDiv; e.stopPropagation(); };
        guestDiv.ondragend = () => { draggedGuest = null; };
        seat.appendChild(guestDiv);
      }
    });
  });

  // Invités non placés
  document.getElementById("guests").innerHTML = "";
  data.guests.forEach(name => {
    let guestDiv = document.createElement("div");
    guestDiv.classList.add("guest");
    guestDiv.textContent = name;
    guestDiv.draggable = true;
    guestDiv.ondragstart = (e) => { draggedGuest = guestDiv; e.stopPropagation(); };
    guestDiv.ondragend = () => { draggedGuest = null; };
    document.getElementById("guests").appendChild(guestDiv);
  });

  updateGuestCount();
}



</script>
<script>
  window.addEventListener("load", () => {
    const savedConfig = localStorage.getItem("guestConfiguration");
    if (savedConfig) {
      try {
        const data = JSON.parse(savedConfig);
        loadConfiguration(data);
      } catch (e) {
        console.error("Erreur de chargement de la configuration sauvegardée :", e);
      }
    }
  });

  function resetConfiguration() {
  // Vider les éléments HTML
  document.getElementById("room").innerHTML = "";
  document.getElementById("guests").innerHTML = "<h3>Liste</h3>";
  document.getElementById("guestCount").textContent = "0";

  // Supprimer du localStorage
  localStorage.removeItem("guestConfiguration");

  // Optionnel : réinitialiser les champs input
  document.getElementById("rectTableCount").value = 1;
  document.getElementById("tableCount").value = 1;
  tableCounter = 1; // Remise à zéro du compteur
}

</script>
<script>
  let zoomLevel = 1;
const zoomStep = 0.1;
const minZoom = 0.4;
const maxZoom = 2;

function applyZoom() {
  document.getElementById("room").style.transform = `scale(${zoomLevel})`;
}

function zoomIn() {
  if (zoomLevel < maxZoom) {
    zoomLevel += zoomStep;
    zoomLevel = Math.min(zoomLevel, maxZoom);
    applyZoom();
  }
}

function zoomOut() {
  if (zoomLevel > minZoom) {
    zoomLevel -= zoomStep;
    zoomLevel = Math.max(zoomLevel, minZoom);
    applyZoom();
  }
}

</script>
<script>
  function openGuestModal() {
  const modal = document.getElementById("guestModal");
  modal.style.display = "flex";

  setTimeout(() => {
  document.getElementById("guestFirstName").focus();
}, 100);

}

function closeGuestModal() {
  const modal = document.getElementById("guestModal");
  modal.style.display = "none";
  document.getElementById("guestFirstName").value = "";
  document.getElementById("guestLastName").value = "";
}

function addGuestFromModal() {
  const firstName = document.getElementById("guestFirstName").value.trim();
  const lastName = document.getElementById("guestLastName").value.trim();

  if (firstName && lastName) {
    const guestDiv = document.createElement("div");
    guestDiv.classList.add("guest");
    guestDiv.textContent = `${firstName} ${lastName}`;
    guestDiv.draggable = true;
    guestDiv.ondragstart = (e) => {
      draggedGuest = guestDiv;
      e.stopPropagation();
    };
    guestDiv.ondragend = () => {
      draggedGuest = null;
    };

    document.getElementById("guests").appendChild(guestDiv);
    updateGuestCount();
    closeGuestModal();
  } else {
    alert("Veuillez entrer le prénom et le nom.");

<script>
  function filterGuests() {
  const filterValue = document.getElementById("guestFilterInput").value.toLowerCase();
  const guests = document.querySelectorAll("#guests .guest");

  guests.forEach(guest => {
    const name = guest.textContent.toLowerCase();
    if (name.includes(filterValue)) {
      guest.style.display = "block";
    } else {
      guest.style.display = "none";
    }
  });
}

</script>
<script>
  let tableToDelete = null;

function openDeleteModal(table) {
  tableToDelete = table;
  document.getElementById("confirmDeleteModal").style.display = "flex";
}

function closeDeleteModal() {
  tableToDelete = null;
  document.getElementById("confirmDeleteModal").style.display = "none";
}

function confirmDelete() {
  if (tableToDelete) {
    const guestsContainer = document.getElementById("guests");

    tableToDelete.querySelectorAll(".seat").forEach(seat => {
      if (seat.firstChild && seat.firstChild.classList.contains("guest")) {
        guestsContainer.appendChild(seat.firstChild);
      }
    });

    tableToDelete.remove();
  }
  closeDeleteModal();
}

</script>
