<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement des invités</title>
  <style>
body {
  display: flex;
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
      font-family: Arial, sans-serif;
      background: #eaeaea;
}

.main-content {
  flex: 1;
  padding: 1rem;
  overflow: auto;
}

.right-sidebar {
  width: 250px;
  background-color: #f4f4f4;
  padding: 1rem;
  overflow-y: auto;
  border-left: 1px solid #ccc;
}

.guest-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.guest-list li {
  margin-bottom: 0.5rem;
}



    #controls {
      width: 200px;
      padding: 10px;
      background: #f4f4f4;
    }
    #guests {
  flex: 1;
  overflow-y: auto;
  background: #fff;
  padding: 5px;
  border: 1px solid #ffc7c7;
  border-radius: 10px;
}


    

    /**Adaptation**/
    
    #controls {
  height: 100vh; /* Hauteur fixe pour ne pas grandir au-delà de la fenêtre */
  display: flex;
  flex-direction: column;
}

#guests {
  flex: 1; /* prend tout l'espace restant */
  overflow-y: auto;
}

    /**End**/

    .guest {
      padding: 5px;
      margin: 5px;
      background: #ffc7c7;
      cursor: grab;
      text-align: center;
      border-radius: 5px;
      user-select: none;
    }
    #room {
      flex: 1;
      position: relative;
      height: 100vh;
      background: #eaeaea;
    }
    .table {
      width: 160px;
      height: 160px;
      background: #6cd3ea;
      border-radius: 50%;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      user-select: none;
    }
    .seat {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    button {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  font-weight: bold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  color: white;
  font-size: 14px;
  transition: background 0.3s;
}

/* Styles spécifiques par fonction */
button[onclick*="generateRectTables"] {
  background-color: #5cb85c;
}
button[onclick*="generateTables"] {
  background-color: #0275d8;
}
button[onclick*="saveConfiguration"] {
  background-color: #f0ad4e;
}
button[onclick*="resetConfiguration"] {
  background-color: #d9534f;
}
input[type="file"] {
  margin-top: 5px;
  width: 100%;
}

button:hover {
  opacity: 0.85;
}
input[type="file"] {
  display: block;
  width: 90%;
  padding: 8px 10px;
  margin: 10px 0;
  font-size: 14px;
  background-color: #fff;
  border: 2px solid #ccc;
  border-radius: 6px;
  cursor: pointer;
  transition: border-color 0.3s, background-color 0.3s;
}

input[type="file"]:hover {
  border-color: #999;
  background-color: #f9f9f9;
}

.file-label {
  display: block;
  width: 90%;
  padding: 10px;
  margin: 5px 0;
  text-align: center;
  background-color: #5bc0de;
  color: white;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
  transition: background-color 0.3s;
}

.file-label:hover {
  background-color: #31b0d5;
}

#zoom-controls {
  position: fixed;
  bottom: 20px;
  right: 330px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 999;
}

#zoom-controls button {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: none;
  font-size: 24px;
  font-weight: bold;
  background-color: #0275d8;
  color: white;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  transition: background-color 0.2s, transform 0.2s;
}

#zoom-controls button:hover {
  background-color: #025aa5;
  transform: scale(1.1);
}

#room {
  transform-origin: top left;
  transition: transform 0.3s ease;
}

/**modale**/



.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0; top: 0;
  width: 100%; height: 100%;
  background-color: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
  animation: fadeIn 0.3s ease forwards;
}

.modal-content {
  background: white;
  padding: 30px;
  border-radius: 8px;
  width: 400px; /* augmenté depuis ~300px */
  max-width: 90%;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  position: relative;
}

.modal-content input[type="text"] {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  border-radius: 5px;
  border: 1px solid #ccc;
  box-sizing: border-box;
  margin-bottom: 15px;
}

.close {
  position: absolute;
  right: 10px;
  top: 10px;
  font-size: 20px;
  font-weight: bold;
  color: #aaa;
  cursor: pointer;
}
.close:hover {
  color: black;
}

/* Animations */
@keyframes fadeIn {
  from { background-color: rgba(0,0,0,0); }
  to   { background-color: rgba(0,0,0,0.5); }
}

@keyframes slideFadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}


  </style>
</head>
<body>
  <!--Menu option à droite-->
  <div id="controls">


    <h3>Invités : <span id="guestCount">0</span></h3>
  
    <!-- Input CSV -->
    <div>
      <label for="csvFileInput" class="file-label">Importer invités (.csv)</label>
      <input type="file" id="csvFileInput" accept=".csv" hidden style="display: none;">
    </div>
  
    <button onclick="openGuestModal()" style="background-color: #5bc0de;">➕ Ajouter un invité</button>




  
    <!--filtre-->
    <input type="text" id="guestFilterInput" placeholder="Rechercher un invité..." style="width: 93%; padding: 5px; margin-bottom: 10px;" oninput="filterGuests()">
    <!-- Zone invités -->
    <div id="guests" ondragover="event.preventDefault()" ondrop="dropGuest(event, this)">
    </div>
  </div>
  <!--Salle-->
  <div class="main-content">
    <div id="room"></div>
  </div>
    <!--Menu invité gauche-->
  <div class="right-sidebar">
          <!-- Input JSON -->
          <div>
            <label for="loadConfig" class="file-label">Charger configuration (.json)</label>
            <input type="file" id="loadConfig" accept=".json" hidden style="display: none;">
          </div>
        
          <!-- Boutons -->
          <div>
            <button onclick="saveConfiguration()">💾 Sauvegarder la disposition</button>
            <button onclick="resetConfiguration()">🔄 Réinitialiser la salle</button>
          </div>
    <h3>Tables</h3>
  
    <p>
      <label for="rectTableCount">Table rectangulaire:</label><br>
      <input type="number" id="rectTableCount" min="1" max="20" value="1">
      <button onclick="generateRectTables()">Ajouter tables</button>
    </p>
  
    <p>
      <label for="tableCount">Table ronde:</label><br>
      <input type="number" id="tableCount" min="1" max="20" value="1">
      <button onclick="generateTables()">Ajouter tables</button>
    </p>
  </div>
  



  <script>
    let draggedGuest = null;
    let offsetX = 0, offsetY = 0;

    document.getElementById('csvFileInput').addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        processCSV(e.target.result);
      };
      reader.readAsText(file);
    });

    function updateGuestCount() {
      let count = document.querySelectorAll("#guests .guest").length;
      document.getElementById("guestCount").textContent = count;
    }


    function processCSV(csvText) {
  const separator = csvText.includes(';') ? ';' : ',';
  const rows = csvText.trim().split('\n').map(row => row.split(separator));
  const guestsContainer = document.getElementById("guests");


  rows.slice(1).forEach(row => {
    if (row.length >= 2) {
      const givenName = String(row[0]).replaceAll('"', '');
      const familyName = String(row[1]).replaceAll('"', '');
      if (givenName && familyName) {
        let guestDiv = document.createElement("div");
        guestDiv.classList.add("guest");
        guestDiv.textContent = `${givenName} ${familyName}`;
        guestDiv.draggable = true;
        guestDiv.ondragstart = (e) => {
          draggedGuest = guestDiv;
          e.stopPropagation();
        };
        guestDiv.ondragend = () => {
          draggedGuest = null;
        };
        guestsContainer.appendChild(guestDiv);
      }
    }
  });

  updateGuestCount(); // Met à jour le compteur après le chargement
}


    function dropGuest(event, target) {
    event.preventDefault();
    if (!draggedGuest) return;

    if (target.classList.contains("seat")) {
        if (!target.hasChildNodes()) {
        target.appendChild(draggedGuest);
        updateGuestCount(); // Mettre à jour le compteur après déplacement
        }
    } else if (target.id === "guests") {
        target.appendChild(draggedGuest);
        updateGuestCount(); // Mettre à jour le compteur après retour dans la liste
    }
    }

    function generateRectTables() {
        let existingRect = document.querySelectorAll(".table.rect").length;
        let newCount = parseInt(document.getElementById("rectTableCount").value);
        let toAdd = newCount - existingRect;
        if (toAdd <= 0) return;

        for (let i = existingRect; i < newCount; i++) {
            createRectTable(100 + i * 230, 400); // Décalé verticalement
        }
    }


    function generateTables() {
  let existingRoundTables = document.querySelectorAll(".table:not(.rect)").length;
  let newTableCount = parseInt(document.getElementById("tableCount").value);
  let tablesToAdd = newTableCount - existingRoundTables;
  if (tablesToAdd <= 0) return;

  for (let i = existingRoundTables; i < newTableCount; i++) {
    createTable(100 + i * 210, 160);
  }
}


function createRectTable(x, y) {
  let table = document.createElement("div");
  table.classList.add("table", "rect");
  table.style.width = "310px";
  table.style.height = "150px"; // ↑ Hauteur augmentée
  table.style.borderRadius = "10px";
  table.style.background = "#a1d99b";
  table.style.position = "absolute";
  table.style.left = `${x}px`;
  table.style.top = `${y}px`;

  table.onmousedown = function (e) {
    if (e.target.classList.contains("guest")) return;
    let draggedTable = table;
    offsetX = e.clientX - table.offsetLeft;
    offsetY = e.clientY - table.offsetTop;
    document.onmousemove = function (e) {
      if (!draggedTable) return;
      draggedTable.style.left = `${e.clientX - offsetX}px`;
      draggedTable.style.top = `${e.clientY - offsetY}px`;
    };
    document.onmouseup = function () {
      draggedTable = null;
      document.onmousemove = null;
    };
  };

  // Espacement horizontal (haut/bas)
  const seatSpacingTopBottom = [10, 60, 110, 160, 210, 260];

  // Espacement vertical (gauche/droite), ajusté pour recentrage
  const seatSideY = [30, 80]; // ↑ Ajusté pour une table de 120px

  const seatTop = -15;
  const seatBottom = 125;     // ↑ Ajusté avec nouvelle hauteur
  const seatLeft = -15;
  const seatRight = 285;

  // Haut
  seatSpacingTopBottom.forEach((left) => {
    let seat = createSeat(left, seatTop);
    table.appendChild(seat);
  });

  // Bas
  seatSpacingTopBottom.forEach((left) => {
    let seat = createSeat(left, seatBottom);
    table.appendChild(seat);
  });

  // Gauche
  seatSideY.forEach((top) => {
    let seat = createSeat(seatLeft, top);
    table.appendChild(seat);
  });

  // Droite
  seatSideY.forEach((top) => {
    let seat = createSeat(seatRight, top);
    table.appendChild(seat);
  });

  document.getElementById("room").appendChild(table);
  return table;

  function createSeat(left, top) {
    let seat = document.createElement("div");
    seat.classList.add("seat");
    seat.style.left = `${left}px`;
    seat.style.top = `${top}px`;
    seat.style.position = "absolute";
    seat.ondragover = (e) => e.preventDefault();
    seat.ondrop = (e) => dropGuest(e, seat);
    return seat;
  }
}




    function createTable(x, y) {
  let table = document.createElement("div");
  table.classList.add("table");
  table.style.left = `${x}px`;
  table.style.top = `${y}px`;
  table.draggable = false;

  table.onmousedown = function (e) {
    if (e.target.classList.contains("guest")) return;
    let draggedTable = table;
    offsetX = e.clientX - table.offsetLeft;
    offsetY = e.clientY - table.offsetTop;
    document.onmousemove = function (e) {
      if (!draggedTable) return;
      draggedTable.style.left = `${e.clientX - offsetX}px`;
      draggedTable.style.top = `${e.clientY - offsetY}px`;
    };
    document.onmouseup = function () {
      draggedTable = null;
      document.onmousemove = null;
    };
  };

  document.getElementById("room").appendChild(table);

  // Ajouter les sièges
  for (let i = 0; i < 8; i++) {
    let seat = document.createElement("div");
    seat.classList.add("seat");
    let angle = (i * 2 * Math.PI) / 8;
    seat.style.left = `${60 + 75 * Math.cos(angle)}px`;
    seat.style.top = `${60 + 75 * Math.sin(angle)}px`;
    seat.ondragover = (e) => e.preventDefault();
    seat.ondrop = (e) => dropGuest(e, seat);
    table.appendChild(seat);
  }

  return table; // On retourne la table créée
}



</script>
  <script>
function saveConfiguration() {
  let tables = document.querySelectorAll(".table");
  let guests = document.querySelectorAll("#guests .guest");

  let data = {
    tables: [],
    guests: [],
    guestCount: guests.length // Sauvegarde le nombre d'invités restants
  };

  // Sauvegarde des tables et de leurs sièges
  tables.forEach((table, tableIndex) => {
    let tableData = {
  id: tableIndex,
  x: table.style.left,
  y: table.style.top,
  type: table.classList.contains("rect") ? "rect" : "round",
  seats: []



};

    table.querySelectorAll(".seat").forEach((seat, seatIndex) => {
      if (seat.firstChild) {
        tableData.seats.push({
          seatIndex: seatIndex,
          guest: seat.firstChild.textContent
        });
      }
    });
    data.tables.push(tableData);
  });

  // Sauvegarde des invités non placés
  guests.forEach(guest => {
    data.guests.push(guest.textContent);
  });

  // Convertir en JSON et télécharger
  let jsonData = JSON.stringify(data, null, 2);
  let blob = new Blob([jsonData], { type: "application/json" });
  let link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "configuration.json";
  link.click();

  localStorage.setItem("guestConfiguration", jsonData)
}

  
    document.getElementById('loadConfig').addEventListener('change', function (event) {
      let file = event.target.files[0];
      if (!file) return;
      
      let reader = new FileReader();
      reader.onload = function (e) {
        let data = JSON.parse(e.target.result);
        loadConfiguration(data);
      };
      reader.readAsText(file);
    });
  
    function loadConfiguration(data) {
  // Nettoyer la salle
  document.getElementById("room").innerHTML = "";

  // Charger les tables
  data.tables.forEach(tableData => {
    // 🔧 Choix de la fonction selon le type
    let table;
    if (tableData.type === "rect") {
      table = createRectTable(parseInt(tableData.x), parseInt(tableData.y));
    } else {
      table = createTable(parseInt(tableData.x), parseInt(tableData.y));
    }

    // Réassignation des invités
    if (table) {
      tableData.seats.forEach(seatData => {
        let seat = table.querySelectorAll(".seat")[seatData.seatIndex];
        if (seat) {
          let guestDiv = document.createElement("div");
          guestDiv.classList.add("guest");
          guestDiv.textContent = seatData.guest;
          guestDiv.draggable = true;
          guestDiv.ondragstart = (e) => {
            draggedGuest = guestDiv;
            e.stopPropagation();
          };
          guestDiv.ondragend = () => {
            draggedGuest = null;
          };
          seat.appendChild(guestDiv);
        }
      });
    }
  });

  // Charger les invités non assignés
  let guestsContainer = document.getElementById("guests");
  data.guests.forEach(guestName => {
    let guestDiv = document.createElement("div");
    guestDiv.classList.add("guest");
    guestDiv.textContent = guestName;
    guestDiv.draggable = true;
    guestDiv.ondragstart = (e) => {
      draggedGuest = guestDiv;
      e.stopPropagation();
    };
    guestDiv.ondragend = () => {
      draggedGuest = null;
    };
    guestsContainer.appendChild(guestDiv);
  });

  // Mise à jour du compteur
  document.getElementById("guestCount").textContent = data.guestCount;
}


</script>
<script>
  window.addEventListener("load", () => {
    const savedConfig = localStorage.getItem("guestConfiguration");
    if (savedConfig) {
      try {
        const data = JSON.parse(savedConfig);
        loadConfiguration(data);
      } catch (e) {
        console.error("Erreur de chargement de la configuration sauvegardée :", e);
      }
    }
  });

  function resetConfiguration() {
  // Vider les éléments HTML
  document.getElementById("room").innerHTML = "";
  document.getElementById("guests").innerHTML = "<h3>Liste</h3>";
  document.getElementById("guestCount").textContent = "0";

  // Supprimer du localStorage
  localStorage.removeItem("guestConfiguration");

  // Optionnel : réinitialiser les champs input
  document.getElementById("rectTableCount").value = 1;
  document.getElementById("tableCount").value = 1;
}

</script>
<script>
  let zoomLevel = 1;
const zoomStep = 0.1;
const minZoom = 0.4;
const maxZoom = 2;

function applyZoom() {
  document.getElementById("room").style.transform = `scale(${zoomLevel})`;
}

function zoomIn() {
  if (zoomLevel < maxZoom) {
    zoomLevel += zoomStep;
    zoomLevel = Math.min(zoomLevel, maxZoom);
    applyZoom();
  }
}

function zoomOut() {
  if (zoomLevel > minZoom) {
    zoomLevel -= zoomStep;
    zoomLevel = Math.max(zoomLevel, minZoom);
    applyZoom();
  }
}

</script>
<script>
  function openGuestModal() {
  const modal = document.getElementById("guestModal");
  modal.style.display = "flex";

  setTimeout(() => {
  document.getElementById("guestFirstName").focus();
}, 100);

}

function closeGuestModal() {
  const modal = document.getElementById("guestModal");
  modal.style.display = "none";
  document.getElementById("guestFirstName").value = "";
  document.getElementById("guestLastName").value = "";
}

function addGuestFromModal() {
  const firstName = document.getElementById("guestFirstName").value.trim();
  const lastName = document.getElementById("guestLastName").value.trim();

  if (firstName && lastName) {
    const guestDiv = document.createElement("div");
    guestDiv.classList.add("guest");
    guestDiv.textContent = `${firstName} ${lastName}`;
    guestDiv.draggable = true;
    guestDiv.ondragstart = (e) => {
      draggedGuest = guestDiv;
      e.stopPropagation();
    };
    guestDiv.ondragend = () => {
      draggedGuest = null;
    };

    document.getElementById("guests").appendChild(guestDiv);
    updateGuestCount();
    closeGuestModal();
  } else {
    alert("Veuillez entrer le prénom et le nom.");
  }
}


// Fermer en cliquant à l'extérieur
window.addEventListener("click", function(event) {
  const modal = document.getElementById("guestModal");
  const modalContent = document.querySelector(".modal-content");

  if (event.target === modal) {
    closeGuestModal();
  }
});


</script>
<script>
  function filterGuests() {
  const filterValue = document.getElementById("guestFilterInput").value.toLowerCase();
  const guests = document.querySelectorAll("#guests .guest");

  guests.forEach(guest => {
    const name = guest.textContent.toLowerCase();
    if (name.includes(filterValue)) {
      guest.style.display = "block";
    } else {
      guest.style.display = "none";
    }
  });
}

</script>
<!--Zoom-->
<div id="zoom-controls">
  <button onclick="zoomIn()">+</button>
  <button onclick="zoomOut()">−</button>
</div>
<!--modale-->
<div id="guestModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeGuestModal()">&times;</span>
    <h3>Ajouter un invité</h3>
    <label>Prénom :</label>
    <input type="text" id="guestFirstName" style="width:100%; margin-bottom:10px;"><br>
    <label>Nom :</label>
    <input type="text" id="guestLastName" style="width:100%; margin-bottom:10px;"><br>
    <button onclick="addGuestFromModal()" style="background-color: #5cb85c;">✅ Ajouter</button>
    <button onclick="closeGuestModal()" style="background-color: #d9534f;">❌ Annuler</button>
  </div>
</div>
